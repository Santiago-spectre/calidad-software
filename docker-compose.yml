services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: papeleria-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - db_data:/var/opt/mssql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: papeleria-app
    depends_on:
      - db
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__CadenaSQL41: "Data Source=db;Initial Catalog=PapeleriaDb;User ID=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      Kestrel__Certificates__Default__Path: /https/devcert.pfx
      Kestrel__Certificates__Default__Password: "${CERT_PASSWORD}"
      EmailSettings__From: "${EMAIL_FROM}"
      EmailSettings__Password: "${EMAIL_PASSWORD}"
    ports:
      - "7054:7054"
    volumes:
      - ./certs:/https:ro

volumes:
  db_data: