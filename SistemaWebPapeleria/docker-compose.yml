services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: papeleria-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1434:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: papeleria-web:1.0
    container_name: papeleria-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      Urls: "http://+:8080"
      AplicarMigraciones: "true"
      ConnectionStrings__CadenaSQL41: "Server=db,1433;Initial Catalog=PapeleriaDb;User ID=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      EmailSettings__From: ${EMAIL_FROM}
      EmailSettings__Password: ${EMAIL_PASSWORD}
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  sqldata: